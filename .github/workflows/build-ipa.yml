name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, 'feat/*' ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build FingerFree IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode & SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Release app (unsigned iphoneos)
        run: |
          xcodebuild \
            -project FingerFree.xcodeproj \
            -scheme FingerFree \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package & verify unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/FingerFree.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: FingerFree.app not found at $APP_PATH"
            exit 1
          fi
          rm -rf output FingerFree-unsigned.ipa
          mkdir -p output/Payload
          cp -R "$APP_PATH" output/Payload/
          # Remove code signature residue if any so sideloading tools sign cleanly
          rm -rf output/Payload/FingerFree.app/_CodeSignature
          cd output
          zip -qr ../FingerFree-unsigned.ipa Payload
          cd ..
          unzip -t FingerFree-unsigned.ipa
          ls -lh FingerFree-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FingerFree-unsigned-ipa
          path: FingerFree-unsigned.ipa
          compression-level: 0
          retention-days: 90

      - name: Publish direct IPA download to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'FingerFree Latest Unsigned IPA' }}
          body: |
            指律 (FingerFree) 自动构建的无签名 iOS IPA。
            **iPhone 用户请直接点击下方 `FingerFree-unsigned.ipa` 下载（无需解压），再用 AltStore / SideStore / Sideloadly / 巨魔签名安装。**
          files: FingerFree-unsigned.ipa
          make_latest: true

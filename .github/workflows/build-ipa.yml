name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, 'feat/*' ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build FingerFree IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode & SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Release app (unsigned iphoneos)
        run: |
          xcodebuild \
            -project FingerFree.xcodeproj \
            -scheme FingerFree \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/FingerFree.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: FingerFree.app not found at $APP_PATH"
            exit 1
          fi
          mkdir -p output/Payload
          cp -R "$APP_PATH" output/Payload/
          cd output
          zip -qry ../FingerFree-unsigned.ipa Payload
          cd ..
          ls -lh FingerFree-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FingerFree-unsigned-ipa
          path: FingerFree-unsigned.ipa
          retention-days: 90

      - name: Create GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FingerFree-unsigned.ipa
          generate_release_notes: true

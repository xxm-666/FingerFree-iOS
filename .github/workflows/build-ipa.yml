name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, 'feat/*' ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build FingerFree IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode & SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Release app (unsigned iphoneos)
        run: |
          xcodebuild \
            -project FingerFree.xcodeproj \
            -scheme FingerFree \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package & verify SideStore-compatible IPA
        id: package
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/FingerFree.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: FingerFree.app not found at $APP_PATH"
            exit 1
          fi
          VERSION=$(grep 'MARKETING_VERSION:' project.yml | head -n1 | sed 's/.*"\(.*\)".*/\1/')
          IPA_NAME="FingerFree-v${VERSION}-unsigned.ipa"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ipa_name=${IPA_NAME}" >> "$GITHUB_OUTPUT"

          rm -rf output FingerFree-*.ipa
          mkdir -p output/Payload
          ditto "$APP_PATH" "output/Payload/FingerFree.app"

          # Validate Info.plist and ensure clean Ad-Hoc signature for SideStore / AltStore
          plutil -lint "output/Payload/FingerFree.app/Info.plist"
          xattr -cr "output/Payload/FingerFree.app"
          rm -rf "output/Payload/FingerFree.app/_CodeSignature"
          codesign --force --deep --sign - --timestamp=none "output/Payload/FingerFree.app"
          codesign --verify --deep --strict --verbose=2 "output/Payload/FingerFree.app"

          # Pack cleanly without macOS resource forks or .DS_Store
          find output -name ".DS_Store" -delete
          cd output
          COPYFILE_DISABLE=1 zip -qr "../${IPA_NAME}" Payload
          cd ..
          unzip -t "${IPA_NAME}"
          ls -lh "${IPA_NAME}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FingerFree-v${{ steps.package.outputs.version }}-unsigned-ipa
          path: ${{ steps.package.outputs.ipa_name }}
          compression-level: 0
          retention-days: 90

      - name: Publish direct IPA download to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: FingerFree v${{ steps.package.outputs.version }} (Unsigned IPA)
          body: |
            指律 (FingerFree) **v${{ steps.package.outputs.version }}** 自动构建的无签名 iOS IPA（Commit `${{ github.sha }}`）。
            **iPhone 用户请直接点击下方 `${{ steps.package.outputs.ipa_name }}` 下载（无需解压），再用 AltStore / SideStore / Sideloadly / 巨魔签名安装。**
          files: ${{ steps.package.outputs.ipa_name }}
          make_latest: true
